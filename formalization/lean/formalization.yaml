version: v0.4
project:
  name: "A finite two-temperature lower bound for the GHR sum-difference constant"
  description: >-
    The Gyarmati-Hennecart-Ruzsa constant C₃ₐ is the supremum of real exponents
    theta for which every K > 1 admits a positive constant c and arbitrarily
    large nonempty finite integer sets X with nonempty partners Y satisfying
    |X+Y| <= K|X| and c|X+Y|^theta <= |X-Y|. This formalization proves the
    strict bound C₃ₐ > 60709/50000 = 1.21418. A finite type at depth 10^13,
    separate difference and sum tilts, cyclic compression, and a proved
    finite-set principle supply the bound. The result concerns extremal
    sumset and difference-set growth in additive combinatorics. The paper's
    general limiting theorem is outside the formalized claim.
  authors: [Carson Olafson]
  responsible_maintainers: [Carson Olafson]
  license: Apache-2.0
classification:
  arxiv: [math.CO, math.NT]
  msc2020: [11B30]
