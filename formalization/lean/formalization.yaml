status:
  scope: >-
    The unconditional strict rational bound is proved using Kleinwaks's
    concrete GHRAdmissible and supremum definitions. Comparator checks
    PalomarC3a.c3a_gt_121418; C3a.c3a_gt_121418 remains the original proof API.
    The four concrete definitions belong to the compared theorem's statement
    closure. definition_names is empty because there are no definition holes.
    Challenge contains one intentional theorem placeholder; the Solution and
    proof development contain no unresolved proof holes or new axioms.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: PalomarC3a.c3a_gt_121418
      file: Solution.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json
      literature_dependencies: []
automation:
  methods:
    - method: agent
      models: [GPT-6 Astra]
      tool_setup: >-
        Wrote the Lean formalization, replaced native finite checks with
        kernel-checked proofs, and prepared the module-system port and Palomar
        interface. Lean, Lake, Mathlib tactics, exact rational arithmetic,
        and kernel evaluation are used for verification.
    - method: agent
      models: [Claude (exact model not recorded)]
      tool_setup: >-
        Adversarial referee review of the first version, as reported by the
        maintainer. This is separate from authorship of the Lean proof and
        is not claimed as a review of the final Palomar branch.
  notes: >-
    Carson Olafson is the human author and responsible maintainer. AI systems
    are credited here as tools, not as project authors. ChatGPT also assisted
    the research, written argument, and independent verification programs as
    disclosed in the root README. TODO: identify the exact Claude model and
    review date if that historical record can be recovered; neither is known
    from the supplied evidence. Costs and complete prompt logs are not recorded.
fidelity:
  divergences: >-
    The claim is the strict finite bound, not the general limiting theorem.
    The Lean construction uses depth 10^13, floored symmetric type counts,
    a Bertrand prime above the difference cardinality plus 161, and dilation
    by two of least-nonnegative integer representatives. This replaces the
    written argument's endpoint rescaling and the older exact-Gibbs instance.
    Sections 6–7 of the paper distinguish the constructions. The legacy Python
    and C++ certificates use a different, much larger depth and are not the
    finite instance in Lean. The definitions of admissibility and C₃ₐ retain
    Kleinwaks's mathematical meaning. Novelty and priority are not established
    by this formalization or by a mechanical preflight.
review:
  status: agent-reviewed
  reviewers: [Claude (exact model not recorded)]
  notes: >-
    The first version received an adversarial Claude review. The historical
    INDEPENDENT_AUDIT_REPORT.md concerns the written argument and arithmetic,
    predates the completed Lean proof, and is not evidence of a final-branch
    Lean or human review. Local build and axiom checks are mechanical checks
    performed by the implementation agent. No external human peer review,
    Palomar editorial clearance, or registration is claimed.
alignment:
  namespace: "PalomarC3a (comparison interface); C3a and MaskedDigit (proof)"
  statements:
