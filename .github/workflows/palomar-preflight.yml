name: Palomar preflight

on:
  workflow_dispatch:
  push:
    branches: [palomar]

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: c3apreflight
      mode: full
      execution_profile: palomar-standard-v1
      options: >-
        {"comparator_config_path":"formalization/lean/comparator.json","project_path":"formalization/lean","formalization_metadata_path":"formalization/lean/formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}
